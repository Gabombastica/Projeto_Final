{% extends 'base.html' %}
{% block conteudo %}
<div class="cabecalho-pagina">
        <div>
            <h1>Equipamentos</h1>
            <p class="subtitulo">Cadastro dos Equipamentos</p>
        </div>
</div>

    {% if request.endpoint == 'novo_equipamento' %}
    <section class="painel formulario">
        <h2>Novo Equipamento</h2>
        <form method="POST" action="{{ url_for('novo_equipamento') }}">
            <div class="linha-campos">
                <div class="campo">
                    <label for="nome">Nome do Equipamento</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="campo">
                    <label for="cliente">Cliente</label>
                    <input type="text" id="cliente" name="cliente" required>
                </div>
                <div class="campo">
                    <label for="quantidade">Quantidade de Equipamentos</label>
                    <input type="number" id="quantidade" name="quantidade" required>
                </div>
                <div class="campo">
                    <label for="nota_cliente">Nota do Cliente</label>
                    <input type="text" id="nota_cliente" name="nota_cliente">
                </div>
            </div>
                <div class="acoes-form">
                    <button type="submit" class="botao">Cadastrar</button>
                    <a href="{{ url_for('equipamentos') }}" class="botao botao-secundario">Cancelar</a>
                </div>
        </form>
    </section>
    {% endif %}
{% endblock conteudo %}
